services:
  - type: web
    name: bank-account-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: web
      - key: WEB_PREFIX
        value: /api
      - key: API_BASE
        value: https://bank-account-api-tlpwq.5sc6y6-2.usa-e2.cloudhub.io/api
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
